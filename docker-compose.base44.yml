services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    command: node server.js
    restart: unless-stopped
