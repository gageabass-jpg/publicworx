<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:920}}">
class Component extends DCLogic {
  state = { periods: null, idx: 1, sel: null, menuOpen: false, view: 'day', card: 0, openPerson: null, sheet: null, report: null };
  componentDidMount() {
    import('./schedule-data.js').then(m => {
      const P = m.PERIODS, today = this.today();
      let idx = P.findIndex(p => { const s = new Date(...p.start); const e = new Date(s); e.setDate(e.getDate() + 27); return today >= s && today <= e; });
      if (idx < 0) idx = P.length - 1;
      this.setState({ periods: P, idx });
    });
    const attach = () => {
      const el = document.querySelector('[data-page]');
      if (!el) { setTimeout(attach, 300); return; }
      if (el.__bounced) return; el.__bounced = true;
      let off = 0, t = null;
      el.addEventListener('wheel', e => {
        const atTop = el.scrollTop <= 0, atBot = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
        if ((atTop && e.deltaY < 0) || (atBot && e.deltaY > 0)) {
          off = Math.max(-64, Math.min(64, off - e.deltaY * 0.28));
          el.style.transition = 'none';
          el.style.transform = 'translateY(' + off + 'px)';
          clearTimeout(t);
          t = setTimeout(() => { off = 0; el.style.transition = 'transform .5s cubic-bezier(.2,.9,.25,1.25)'; el.style.transform = 'translateY(0px)'; }, 90);
        }
      }, { passive: true });
    };
    attach();
  }
  today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
  photo(name) {
    const map = { 'Lora': 'lorahall', 'Heather': 'heatheryoung', 'Dave': 'davefrady', 'Trista': 'tristamiller', 'Christy': 'christybailey', 'Shelby': 'shelbysmith', 'Lana': 'lanamiller', 'Rachel': 'rachelboothe', 'Bailey': 'baileyadkins', 'Savannah': 'savannahplummer', 'Linsey': 'linseyhackney', 'Krista': 'kristamorton', 'Hannah': 'hannahmartin', 'Brayden': 'braydensims', 'Taryn': 'tarynpreece', 'Baylee': 'bayleeviars', 'Barb': 'barbhutchinson', 'Brandy': 'brandybeaver', 'Cory': 'corydolan', 'Dawson': 'dawsonquick', 'Jarrod': 'jarrodmcclanahan', 'Donnie': 'donniedavis', 'Lisa': 'lisaroberts' };
    const f = map[name.split(' ')[0]];
    return f ? "url('headshots/" + f + ".jpg')" : 'none';
  }
  ampm(l) { return l.replace(/a$/, 'am').replace(/p$/, 'pm'); }
  parseTok(t) {
    const m = t.match(/^(\d{1,2}):?(\d{2})?(a|p)?$/); if (!m) return null;
    let h = +m[1], mm = m[2] || '', ap = m[3];
    return { label: h + (mm ? ':' + mm : ''), h, mm, ap };
  }
  parseCode(raw) {
    const oncall = raw.includes('*'); let c = raw.replace(/[*~]/g, '').trim();
    if (c === '/') return { off: true };
    if (c === 'V') return { vac: true };
    if (c === 'H') return { hol: true };
    const maps = { '7': '7a-730p', '(7)': '7a-730p', '8': '8a-430p', '(8)': '8a-430p', '3': '3p-1130p', '11': '11p-730a', '2-1130p': '2p-1130p', '1-1130p': '1p-1130p', '530-1130p': '530p-1130p', '7-230': '7a-230p' };
    if (maps[c]) c = maps[c];
    const words = c.split(' ');
    const ti = words.findIndex(w => /\d/.test(w) && w.includes('-'));
    if (ti < 0) return { off: true };
    const extra = words.filter((w, i) => i !== ti).join(' ');
    const [sT, eT] = words[ti].split('-');
    const s = this.parseTok(sT), e = this.parseTok(eT);
    if (!s || !e) return { off: true };
    if (!e.ap) e.ap = 'p'; if (!s.ap) s.ap = e.ap === 'p' && s.h <= 12 ? 'a' : 'a';
    const h24 = t => t.h % 12 + (t.ap === 'p' ? 12 : 0) + (t.mm ? +t.mm / 60 : 0);
    const sH = h24(s); let eH = h24(e); if (eH <= sH) eH += 24;
    const sL = s.label + s.ap, eL = e.label + e.ap;
    const type = (sH >= 19 || eH > 24) ? 'night' : sH >= 12 ? 'eve' : (sH >= 11 && eH >= 23) ? 'eve' : 'day';
    return { sL, eL, sH, hours: eH - sH, extra, type, oncall, time: sL + '\u2013' + eL + (extra ? ' ' + extra : '') };
  }
  renderVals() {
    const T = {
      day: { edge: 'rgba(217,165,62,.55)', glow: 'rgba(217,165,62,.10)', c: '#e3c37a', bg: 'rgba(217,165,62,.16)', bd: 'rgba(217,165,62,.38)', fg: '#e8ca82' },
      eve: { edge: 'rgba(145,132,217,.60)', glow: 'rgba(145,132,217,.12)', c: '#b3a7e8', bg: 'rgba(145,132,217,.16)', bd: 'rgba(145,132,217,.40)', fg: '#c9c0f0' },
      night: { edge: 'rgba(63,191,174,.50)', glow: 'rgba(63,191,174,.09)', c: '#7fd8ca', bg: 'rgba(63,191,174,.13)', bd: 'rgba(63,191,174,.34)', fg: '#8adfd2' },
      oncall: { bg: 'rgba(217,92,92,.18)', bd: 'rgba(217,92,92,.44)', fg: '#eda3a3' }
    };
    const st = this.state, P = st.periods, per = P ? P[st.idx] : null;
    const today = this.today();
    const base = per ? new Date(...per.start) : today;
    const dateOf = o => { const d = new Date(base); d.setDate(d.getDate() + o - 1); return d; };
    let todayOff = null;
    if (per) { const diff = Math.round((today - base) / 86400000) + 1; if (diff >= 1 && diff <= 28) todayOff = diff; }
    const sel = st.sel ?? todayOff ?? 1;
    const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const calDays = [];
    for (let o = 1; o <= 28; o++) {
      const d = dateOf(o), isSel = o === sel, past = todayOff && o < todayOff;
      calDays.push({
        num: d.getDate(), mon: (o === 1 || d.getDate() === 1) ? MON[d.getMonth()] : '',
        bg: isSel ? 'linear-gradient(160deg, rgba(145,132,217,.45), rgba(145,132,217,.15))' : 'rgba(233,233,237,.045)',
        bd: isSel ? 'rgba(145,132,217,.6)' : 'rgba(233,233,237,.08)',
        fg: 'var(--color-text)', op: past && !isSel ? .45 : 1,
        dot: o === todayOff ? 'var(--color-accent)' : 'transparent',
        select: () => this.setState({ sel: o })
      });
    }
    const groups = { day: [], eve: [], night: [] };
    const staff = [];
    const fmtD = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (per) per.sections.forEach(([label, rows]) => {
      staff.push({ isSection: true, isPerson: false, name: label.toUpperCase() });
      rows.forEach(([name, spec]) => {
        const nm = name.replace(' (traveler)', '');
        const byDay = {};
        spec.split(',').forEach(ent => { const i = ent.indexOf(':'); byDay[+ent.slice(0, i)] = ent.slice(i + 1); });
        const shifts = []; const wk = [0, 0, 0, 0]; let onCalls = 0;
        for (let o = 1; o <= 28; o++) {
          const code = byDay[o]; if (!code) continue;
          const p = this.parseCode(code);
          const d = dateOf(o);
          const row = { date: fmtD(d).replace(',', ''), op: todayOff && o < todayOff ? .5 : 1, hours: '', bg: 'transparent', bd: 'transparent', fg: 'var(--color-neutral-300)' };
          if (p.off) { shifts.push({ ...row, label: 'Requested off', fg: 'var(--color-neutral-500)' }); continue; }
          if (p.vac) { shifts.push({ ...row, label: 'Vacation', bd: 'rgba(233,233,237,.28)' }); continue; }
          if (p.hol) { shifts.push({ ...row, label: 'Holiday', fg: 'var(--color-neutral-400)' }); continue; }
          const t = p.oncall ? T.oncall : T[p.type];
          wk[Math.floor((o - 1) / 7)] += p.hours; if (p.oncall) onCalls++;
          const hrs = Number.isInteger(p.hours) ? String(p.hours) : p.hours.toFixed(1);
          shifts.push({ ...row, label: this.ampm(p.sL) + '\u2013' + this.ampm(p.eL) + (p.extra ? ' \u00b7 ' + p.extra : '') + (p.oncall ? ' \u00b7 on call' : ''), bg: t.bg, bd: t.bd, fg: t.fg, hours: hrs + 'h' });
          if (o === sel) {
            const info = { name: nm, g: p.type, imgCss: this.photo(nm), verb: 'is working', time: this.ampm(p.sL) + ' to ' + this.ampm(p.eL) + (p.extra ? ' ' + p.extra : ''), oncall: p.oncall, date: fmtD(d) };
            groups[p.type].push({ name: nm, sH: p.sH, imgCss: info.imgCss, time: p.sL + '\u2013' + p.eL, oncall: p.oncall,
              rowBg: p.oncall ? 'rgba(217,92,92,.10)' : 'transparent',
              open: () => { clearTimeout(this._settleT); this.setState({ sheet: info, settled: false, report: null }); this._settleT = setTimeout(() => this.setState({ settled: true }), 640); } });
          }
        }
        const total = wk.reduce((a, b) => a + b, 0);
        const open = st.openPerson === nm;
        staff.push({ isSection: false, isPerson: true, name: nm, imgCss: this.photo(nm), open,
          ring: open ? 'rgba(145,132,217,.45)' : 'rgba(233,233,237,.10)',
          chev: open ? 'rotate(90deg)' : 'none',
          toggle: () => this.setState(s => ({ openPerson: s.openPerson === nm ? null : nm })),
          summary: (Number.isInteger(total) ? total : total.toFixed(1)) + 'h' + (onCalls ? ' \u00b7 ' + onCalls + ' on call' : ''),
          shifts, weeks: 'Weeks ' + wk.map(h => h ? (Number.isInteger(h) ? h : h.toFixed(1)) : '\u00b7').join(' / '),
          total: (Number.isInteger(total) ? total : total.toFixed(1)) + ' h total' });
      });
    });
    const cards = [{ title: 'Day', k: 'day' }, { title: 'Evening', k: 'eve' }, { title: 'Night', k: 'night' }].map(c => {
      const ppl = groups[c.k].sort((a, b) => a.sH - b.sH);
      const flipped = !!st.sheet && st.sheet.g === c.k;
      const settled = flipped && st.settled;
      return { title: c.title, people: ppl, count: ppl.length, edge: T[c.k].edge, glow: T[c.k].glow, color: T[c.k].c, emptyShow: !ppl.length,
        flip: settled ? 'none' : (flipped ? 'rotateX(180deg)' : 'rotateX(0deg)'), z: flipped ? 25 : 1,
        flipTr: (settled || st.closing) ? 'none' : 'transform .6s cubic-bezier(.35,.1,.2,1)',
        backT: settled ? 'none' : 'rotateX(180deg)', backVis: 'visible',
        frontOp: flipped ? 0 : 1, frontPe: flipped ? 'none' : 'auto' };
    });
    const sd = dateOf(sel);
    const fmtR = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const endD = new Date(base); endD.setDate(endD.getDate() + 27);
    return {
      periodTitle: per ? fmtR(base) + ' \u2013 ' + fmtR(endD) : 'Loading\u2026',
      menuOpen: st.menuOpen, toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      chevRot: st.menuOpen ? 'rotate(180deg)' : 'none',
      periodTabs: (P || []).map((p, i) => ({ title: p.title, active: i === st.idx, fg: i === st.idx ? 'var(--color-accent-200)' : 'var(--color-text)', bg: i === st.idx ? 'rgba(145,132,217,.10)' : 'transparent', pick: () => this.setState({ idx: i, sel: null, menuOpen: false }) })),
      dows: ['S','M','T','W','T','F','S'].map(l => ({ l })),
      calDays,
      showDay: st.view === 'day', showStaff: st.view === 'staff',
      selDateLabel: sd.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }),
      isToday: sel === todayOff,
      cards,
      onCardsScroll: e => { const el = e.currentTarget; const i = Math.round(el.scrollLeft / (el.clientWidth - 20)); if (i !== st.card) this.setState({ card: Math.max(0, Math.min(2, i)) }); },
      cardDots: ['Day','Evening','Night'].map((n, i) => ({ w: i === st.card ? '20px' : '6px', bg: i === st.card ? 'var(--color-accent-300)' : 'rgba(233,233,237,.18)', go: () => { const el = document.querySelector('[data-cards]'); if (el) el.scrollTo({ left: i * (el.clientWidth - 20), behavior: 'smooth' }); } })),
      staff,
      viewDay: () => this.setState({ view: 'day' }), viewStaff: () => this.setState({ view: 'staff' }),
      goDesktop: () => { window.location.href = 'index.html?desktop=1'; },
      dayTabBg: st.view === 'day' ? 'rgba(145,132,217,.18)' : 'transparent', dayTabFg: st.view === 'day' ? 'var(--color-accent-200)' : 'var(--color-neutral-400)',
      staffTabBg: st.view === 'staff' ? 'rgba(145,132,217,.18)' : 'transparent', staffTabFg: st.view === 'staff' ? 'var(--color-accent-200)' : 'var(--color-neutral-400)',
      sheetShow: !!st.sheet, closeSheet: () => {
        clearTimeout(this._settleT);
        if (st.settled) {
          this.setState({ settled: false, closing: true });
          requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ closing: false, sheet: null, report: null })));
        } else this.setState({ sheet: null, settled: false, report: null });
      },
      shName: st.sheet && st.sheet.name, shVerb: st.sheet && st.sheet.verb, shTime: st.sheet && st.sheet.time,
      shDate: st.sheet && st.sheet.date, shOnCall: !!(st.sheet && st.sheet.oncall),
      shImgCss: st.sheet ? st.sheet.imgCss : 'none',
      reportLabel: st.report === 'sending' ? 'Sending…' : st.report === 'sent' ? 'Reported ✓' : st.report === 'error' ? 'Failed — tap to retry' : "I'm Not Working",
      reportFg: st.report === 'sent' ? '#8adfd2' : '#eda3a3',
      reportBd: st.report === 'sent' ? 'rgba(63,191,174,.5)' : 'rgba(217,92,92,.55)',
      reportBg: st.report === 'sent' ? 'rgba(63,191,174,.13)' : 'rgba(217,92,92,.10)',
      reportOff: (e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        const s = st.sheet; if (!s || st.report === 'sending' || st.report === 'sent') return;
        this.setState({ report: 'sending' });
        fetch('https://formspree.io/f/moeqkzvq', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ name: s.name, message: s.name + ' reports they are NOT working this shift.', regarding: s.date + ' · ' + s.time + (s.oncall ? ' · on call' : ''), _subject: 'Schedule Stream — ' + s.name + ' not working ' + s.date, source: 'mobile' }) })
          .then(r => this.setState({ report: r.ok ? 'sent' : 'error' }))
          .catch(() => this.setState({ report: 'error' }));
      }
    };
  }
}
</script>
